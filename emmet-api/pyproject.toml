[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
only-include = ["emmet/api"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = [
  "emmet/api",
  "tests",
  "pyproject.toml",
]

[project]
name = "emmet-api"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Emmet API Server"
authors = [
  { name = "The Materials Project", email = "feedback@materialsproject.org" },
]
license = "BSD-3-Clause-LBNL"
dependencies = [
  "emmet-core>=0.87.1",
  "fastapi>=0.123.1",
  "gunicorn==24.1.1",
  "boto3",
  "ddtrace==4.8.2",
  "setproctitle",
  "shapely",
  "asgi-logger",
  "pymatgen-analysis-alloys>=0.0.3",
  "pymatgen-analysis-defects>=2024.10.22",
  "pymatgen-io-validation>=0.1.1",
  "uvicorn>=0.18.3",
  "pymongo>=4.10.1",
]

[project.urls]
Homepage = "https://github.com/materialsproject/emmet/tree/main/emmet-api/"
Documentation = "https://materialsproject.github.io/emmet/"

[project.optional-dependencies]
test = [
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "pycodestyle",
  "pydocstyle",
  "flake8",
  "mypy",
  "mypy-extensions",
  "types-setuptools",
  "types-requests",
  "starlette[full]",
  "mongomock",
]
docs = [
  "mkdocs",
  "mkdocs-material<8.3",
  "mkdocs-material-extensions",
  "mkdocs-minify-plugin",
  "mkdocstrings",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-markdownextradata-plugin",
  "mkdocstrings[python]",
  "livereload",
  "jinja2",
]
