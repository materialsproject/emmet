
[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
only-include = ["emmet/cli"]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.sdist]
include = [
  "emmet/cli",
  "tests",
  "pyproject.toml",
]

[project]
name = "emmet-cli"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Command line interface for ingestion of electronic structure calculations into MP."
license = "BSD-3-Clause-LBNL"
authors = [
  { name = "The Materials Project", email = "feedback@materialsproject.org" },
]
dependencies = [
  "click",
  "colorama",
  "emmet-core>=0.85.1",
  "pymatgen-io-validation>=0.1.1",
  "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/materialsproject/emmet/tree/main/emmet-cli/"
Documentation = "https://materialsproject.github.io/emmet/"

[project.optional-dependencies]
test = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pycodestyle",
  "pydocstyle",
  "flake8",
  "mypy",
  "mypy-extensions",
  "types-setuptools",
  "types-requests",
  "blake3",
]
docs = [
  "mkdocs",
  "mkdocs-material<8.3",
  "mkdocs-material-extensions",
  "mkdocs-minify-plugin",
  "mkdocstrings",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-markdownextradata-plugin",
  "mkdocstrings[python]",
  "livereload",
  "jinja2",
]

[project.scripts]
emmet = "emmet.cli.entry_point:safe_entry_point"
